<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .preview-card {
        background: white;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 600px;
      }

      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: linear-gradient(45deg, #667eea, #764ba2);
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 48px;
        font-weight: bold;
      }

      h1 {
        color: #2d3748;
        margin: 0 0 10px 0;
        font-size: 32px;
      }

      .tagline {
        color: #4a5568;
        font-size: 18px;
        margin: 0 0 20px 0;
      }

      .description {
        color: #718096;
        line-height: 1.6;
        margin: 0;
      }

      .tech-stack {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .tech-tag {
        background: #e2e8f0;
        color: #4a5568;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="preview-card">
      <div class="profile-img">RM</div>
      <h1>Rajeshwari Mali</h1>
      <div class="tagline">AI &amp; Data Science Student | AI/ML Developer</div>
      <div class="description">
        Building practical AI solutions that turn real-world problems into intelligent products.
      </div>
      <div class="tech-stack">
        <span class="tech-tag">AI/ML</span>
        <span class="tech-tag">Deep Learning</span>
        <span class="tech-tag">Computer Vision</span>
        <span class="tech-tag">Python</span>
        <span class="tech-tag">FastAPI</span>
      </div>
    </div>
  </body>
</html>
